name: CI

on:
  push:
    branches: [main, mono-package]
  pull_request:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.12.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Graph, runtime, type, and build gates
        run: pnpm workspace:build && pnpm workspace:typecheck && pnpm build:cli && pnpm lint && pnpm exec tsc --noEmit

      - name: Prove invalid boundaries are rejected
        run: pnpm check:boundary-fixtures

      - name: Supply-chain and production advisory gate
        run: pnpm check:supply-chain

      - name: Baseline contract and unit tests
        run: pnpm test

      - name: Package-owned unit and contract suites
        run: pnpm test:packages

      - name: Packed package and runtime matrix
        run: pnpm test:pack
