name: Sandbox

# Sandbox behaviour is a property of the host kernel, not of the code alone: a
# profile that enforces correctly on one platform can silently enforce nothing
# on another. Every supported platform therefore runs real confined commands and
# asserts the outcome, so a platform that stops confining fails the build.

on:
  push:
    branches: [main, mono-package]
    paths:
      - 'packages/sandbox/**'
      - 'packages/sandbox-node/**'
      - 'scripts/acceptance-sandbox.mts'
      - 'scripts/fuzz-sandbox.mts'
      - 'scripts/test-packed-sandbox.mts'
      - 'tests/unit/sandbox*.spec.ts'
      - '.github/workflows/sandbox.yml'
  pull_request:
    paths:
      - 'packages/sandbox/**'
      - 'packages/sandbox-node/**'
      - 'scripts/acceptance-sandbox.mts'
      - 'scripts/fuzz-sandbox.mts'
      - 'scripts/test-packed-sandbox.mts'
      - 'tests/unit/sandbox*.spec.ts'
      - '.github/workflows/sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  enforcement:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both architectures per platform: a sandbox is a kernel boundary, and
          # the kernel differs across them — Landlock/seccomp ABI on arm64
          # Linux, Rosetta and the x86_64 Seatbelt image on macOS, and a wholly
          # separate Windows build for arm64.
          - os: ubuntu-24.04
            label: linux x64 (bubblewrap)
          - os: ubuntu-24.04-arm
            label: linux arm64 (bubblewrap)
          - os: ubuntu-22.04
            label: linux x64 (bubblewrap, older kernel policy)
          - os: ubuntu-22.04-arm
            label: linux arm64 (bubblewrap, older kernel policy)
          - os: macos-15
            label: macos arm64 (seatbelt)
          - os: macos-15-intel
            label: macos x64 (seatbelt)
          - os: macos-14
            label: macos arm64 (seatbelt, older)
          - os: windows-2025
            label: windows x64 (fence only, fails closed)
          - os: windows-11-arm
            label: windows arm64 (fence only, fails closed)
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.18.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          bwrap --version

      # Ubuntu 24.04 ships an AppArmor policy that denies unprivileged user
      # namespaces, which is exactly what bubblewrap needs. Relaxing it here
      # keeps the matrix testing the sandbox rather than the runner image; the
      # probe's fail-closed path is covered by the Windows leg instead.
      - name: Permit unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo 'kernel does not restrict unprivileged user namespaces'
          fi

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Build the sandbox packages
        run: pnpm --filter @alvin0/ai-agent-sdk-sandbox build && pnpm --filter @alvin0/ai-agent-sdk-sandbox-node build

      - name: Contract unit tests
        run: pnpm --filter @alvin0/ai-agent-sdk-sandbox test

      - name: Provider unit tests
        run: pnpm --filter @alvin0/ai-agent-sdk-sandbox-node test

      - name: Enforced-behaviour acceptance
        run: node --experimental-strip-types scripts/acceptance-sandbox.mts

      # Hand-written cases test what their author suspected; every defect that
      # reached this package was one nobody wrote a case for. The fuzzer
      # generates policies and paths instead, and requires the layer algebra,
      # the in-process fence and the kernel profile to agree.
      - name: Differential policy fuzzing
        run: node --experimental-strip-types scripts/fuzz-sandbox.mts --algebra=20000 --backend=150

      - name: Packed consumer fixtures
        run: pnpm --filter @alvin0/ai-agent-sdk-sandbox test:pack && pnpm --filter @alvin0/ai-agent-sdk-sandbox-node test:pack

  # A host that refuses a private /proc — the common container case — selects the
  # restricted bubblewrap rung instead of failing outright. The VM legs above
  # never exercise it, so it is covered here against a real container kernel.
  containerized:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux x64 (bubblewrap, restricted /proc)
          - os: ubuntu-24.04-arm
            label: linux arm64 (bubblewrap, restricted /proc)
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.18.0

      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0 --ignore-scripts

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Pack the sandbox packages
        run: |
          pnpm --filter @alvin0/ai-agent-sdk-sandbox build
          pnpm --filter @alvin0/ai-agent-sdk-sandbox-node build
          pnpm --filter @alvin0/ai-agent-sdk-sandbox run pack
          pnpm --filter @alvin0/ai-agent-sdk-sandbox-node run pack

      - name: Enforced-behaviour acceptance inside a container
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --cap-add SYS_ADMIN \
            -v "$PWD":/w:ro node:22-bookworm bash -c '
              set -e
              apt-get update -qq && apt-get install -y -qq bubblewrap
              mkdir -p /tmp/acceptance && cd /tmp/acceptance && npm init -y > /dev/null
              npm install --no-audit --no-fund \
                /w/packages/sandbox/artifacts/*.tgz \
                /w/packages/sandbox-node/artifacts/*.tgz > /dev/null
              cp /w/scripts/acceptance-sandbox.mts ./acceptance.mts
              node --experimental-strip-types acceptance.mts
            '

  required:
    if: always()
    needs: [enforcement, containerized]
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform leg
        env:
          ENFORCEMENT: ${{ needs.enforcement.result }}
          CONTAINERIZED: ${{ needs.containerized.result }}
        run: test "$ENFORCEMENT" = success && test "$CONTAINERIZED" = success
